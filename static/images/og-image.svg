<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="WORKA SOLUTION">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#111111" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#f5c400"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Geometric composition -->
  <circle cx="1040" cy="150" r="120" fill="#0057b8" stroke="#111111" stroke-width="8"/>
  <rect x="1000" y="360" width="120" height="120" fill="#e03c31" stroke="#111111" stroke-width="8"/>
  <path d="M900 560 L1040 380 L1180 560 Z" fill="#fbf7ec" stroke="#111111" stroke-width="8"/>

  <!-- Top stripe -->
  <rect x="0" y="0" width="400" height="10" fill="#e03c31"/>
  <rect x="400" y="0" width="400" height="10" fill="#fbf7ec"/>
  <rect x="800" y="0" width="400" height="10" fill="#0057b8"/>

  <!-- Brand mark -->
  <rect x="96" y="84" width="72" height="72" fill="#111111"/>
  <path d="M112 100l7 32 12-20 12 20 7-32" fill="none" stroke="#f5c400" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>

  <g fill="#111111" font-family="'Archivo Black', 'Arial Black', Arial, sans-serif">
    <text x="96" y="262" font-size="24" letter-spacing="6" font-family="Arial, Helvetica, sans-serif" font-weight="700">PT PERORANGAN &#183; 14 KLBI TEKNOLOGI</text>
    <text x="96" y="382" font-size="104">WORKA</text>
    <text x="96" y="472" font-size="104">SOLUTION</text>
  </g>

  <g font-family="Jost, Arial, Helvetica, sans-serif">
    <text x="96" y="540" font-size="32" fill="#111111" font-weight="600">Solusi Teknologi Terintegrasi untuk Bisnis Modern</text>
    <text x="96" y="590" font-size="22" fill="#111111" fill-opacity="0.7" letter-spacing="2">SOFTWARE &#183; DESIGN &#183; NETWORK &#183; SUPPORT</text>
  </g>

  <rect x="96" y="506" width="88" height="6" fill="#e03c31"/>
</svg>
