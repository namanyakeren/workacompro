<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.brand_name }}</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '{{ site.primary_color }}',
                        secondary: '{{ site.secondary_color }}',
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50">
<div class="min-h-screen flex items-center justify-center px-4 py-12 bg-gradient-to-br from-slate-50 via-white to-primary/5">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center space-x-3 mb-6">
                {% if !site.logo.is_empty() %}
                <img src="{{ site.logo }}" alt="{{ site.brand_name }}" class="h-12 w-auto">
                {% else %}
                <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center">
                    <i data-lucide="cpu" class="w-7 h-7 text-white"></i>
                </div>
                {% endif %}
                <span class="text-2xl font-bold text-slate-900">{{ site.brand_name }}</span>
            </a>
            <h1 class="text-2xl font-bold text-slate-900">Admin Panel</h1>
            <p class="text-slate-500 mt-2">Masuk untuk mengelola konten website</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
            {% if !error.is_empty() %}
            <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2" role="alert">
                <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
                {{ error }}
            </div>
            {% endif %}

            <form id="login-form" hx-post="/admin/login" hx-target="#form-response" hx-swap="innerHTML" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="text" id="username" name="username" required autocomplete="username" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="Masukkan username">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="password" id="password" name="password" required autocomplete="current-password" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="Masukkan password">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-primary text-white rounded-lg font-semibold hover:bg-blue-600 transition shadow-lg shadow-primary/25 flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    Masuk
                </button>
            </form>

            <div id="form-response"></div>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-500">
                <p>Hanya untuk pengguna berwenang</p>
                <a href="/" class="text-primary hover:underline ml-2">Kembali ke Website</a>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    const form = document.getElementById('login-form');
    if (form) {
        form.addEventListener('htmx:afterRequest', (evt) => {
            if (evt.detail.successful) {
                try {
                    const response = JSON.parse(evt.detail.xhr.responseText);
                    if (response.success && response.data && response.data.redirect) {
                        window.location.href = response.data.redirect;
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        });
    }
</script>
</body>
</html>
