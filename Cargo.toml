[package]
name = "worka-solution"
version = "0.1.0"
edition = "2021"
description = "WORKA SOLUTION Company Profile Website"
license = "MIT"

[dependencies]
# Web Framework
salvo = { version = "0.61", features = ["compression", "rustls", "session", "cors", "serve-static", "salvo_extra", "affix"] }
tokio = { version = "1.38", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Templates
askama = "0.12"

# Auth & Security
argon2 = "0.5"
jsonwebtoken = "9.2"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Config
config = { version = "0.14", features = ["toml"] }
dotenvy = "0.15"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
thiserror = "1.0"
mime_guess = "2.0"
sha2 = "0.10"
hex = "0.4"
base64 = { version = "0.22", features = ["std"] }

# Image processing
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }

# HTMX utilities
serde_urlencoded = "0.7"

[build-dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }

[[bin]]
name = "worka-solution"
path = "src/main.rs"